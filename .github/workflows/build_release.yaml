name: Build & Release

on:
  push:
    branches:  
      - 'main'
    paths:
      - 'app/lib/**'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:

      version: ${{ steps.yaml-version.outputs['version'] }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse pubspec.yaml
        id: yaml-version
        uses: nichmor/minimal-read-yaml@v0.0.2
        with:
          config: app/pubspec.yaml

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          tag_name: v${{ steps.yaml-version.outputs['version'] }}

  build_android:
    name: Build and sign android bundle
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4

      - name: Inject build number
        uses: rmeneely/update-yaml@v1
        with:
          infile: app/pubspec.yaml
          varlist: version=${{ needs.create-release.outputs.version }}+${{ github.run_number }}


      - name: Setup the Java environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup the flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Create signing key
        uses: timheuer/base64-to-file@v1.2
        with:
          fileDir: ${{ github.workspace }}/app/android/
          fileName: "keystore.jks"
          encodedString: ${{ secrets.ANDROID_KEY_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > app/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> app/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> app/android/key.properties
          echo "storeFile=${{ github.workspace }}/app/android/keystore.jks" >> app/android/key.properties

      - name: Build appbundle
        working-directory: app
        run: |
          flutter pub get
          flutter build appbundle \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ls -lah

      - name: Rename bundle
        run: mv app/build/app/outputs/bundle/release/app-release.aab app/build/app/outputs/bundle/release/grobase-${{ needs.create-release.outputs.version }}-android.aab

      - name: Create symbols archive
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: "zip"
          filename: grobase-${{ needs.create-release.outputs.version }}-android-symbols.zip
          directory: app/build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib

      - name: Add files to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            draft: true
            tag_name: v${{ needs.create-release.outputs.version }}
            files: |
              **/grobase-${{ needs.create-release.outputs.version }}-android-symbols.zip
              **/grobase-${{ needs.create-release.outputs.version }}-android.aab
  
