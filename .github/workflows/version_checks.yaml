name: Version checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - main

jobs:

  check-files-changed:
    name: Check files have changed that would require a version bump.
    runs-on: ubuntu-latest
    outputs:
      should-verify-app: ${{ contains(steps.app-files.outputs.changed_files, 'app/lib/') }}
      should-verify-firmware: ${{ contains(steps.firmware-files.outputs.changed_files, 'firmware/include/') || contains(steps.firmware-files.outputs.changed_files, 'firmware/src/') || contains(steps.firmware-files.outputs.changed_files, 'firmware/platformio.ini') }}
    steps:
      - id: app-files
        uses: knu/changed-files@v1
        with:
          paths: |
            'app/lib/**'

      - id: firmware-files
        uses: knu/changed-files@v1
        with:
          paths: |
            'firmware/include/**'
            'firmware/src/**'
            'firmware/platformio.ini'

      - name: show changed files
        run: |
          echo "App changed files:"
          echo "${{ steps.app-files.outputs.changed_files }}"
          echo "App matched files:"
          echo "${{ steps.app-files.outputs.matched_files }}"
          echo "Should verify app:"
          echo "${{ contains(steps.app-files.outputs.changed_files, 'app/lib/') }}"
          echo "Firmware changed files:"
          echo "${{ steps.firmware-files.outputs.changed_files }}"
          echo "Firmware matched files:"
          echo "${{ steps.firmware-files.outputs.matched_files }}"
          echo "Should verify firmware:"
          echo "${{ contains(steps.firmware-files.outputs.changed_files, 'firmware/include/') || contains(steps.firmware-files.outputs.changed_files, 'firmware/src/') || contains(steps.firmware-files.outputs.changed_files, 'firmware/platformio.ini') }}"

  verify-app-version:
    name: Verify pubspec version has been bumped & release notes updated.
    runs-on: ubuntu-latest
    needs: check-files-changed
    if: ${{ needs.check-files-changed.outputs.should-verify-app == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure pubspec and release notes have been updated
        uses: danieljimeneznz/ensure-files-changed@v4.1.1
        with:
          require-changes-to: |
            app/pubspec.yaml
            app/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse pubspec.yaml
        id: yaml-version
        uses: nichmor/minimal-read-yaml@v0.0.2
        with:
          config: app/pubspec.yaml

      - name: Print pubspec.yaml version
        run: |
          echo "${{ steps.yaml-version.outputs['version'] }}"

      - name: Fetch previous app tag
        id: tag-version
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$tag" ]; then
            tag=v0.0.1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag"

      - uses: dart-lang/setup-dart@v1
      - name: Verify version increase
        id: version-up
        working-directory: app/version_check
        run: |
          dart pub get
          dart run bin/version_check.dart -p "${{ steps.tag-version.outputs.tag }}" -n "${{ steps.yaml-version.outputs['version'] }}"

  verify-firmware-version:
    name: Verify firmware version has been bumped & release notes updated.
    runs-on: ubuntu-latest
    needs: check-files-changed
    if: ${{ needs.check-files-changed.outputs.should-verify-firmware == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure firmware version and release notes have been updated
        uses: danieljimeneznz/ensure-files-changed@v4.1.1
        with:
          require-changes-to: |
            firmware/include/firmware_version.h
            firmware/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read firmware version
        id: firmware-version
        run: |
          version=$(sed -n 's/^#define FIRMWARE_VERSION "\([^"]*\)"/\1/p' firmware/include/firmware_version.h)
          if [ -z "$version" ]; then
            echo "Could not read FIRMWARE_VERSION from firmware/include/firmware_version.h"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version"

      - name: Fetch previous firmware tag
        id: tag-version
        run: |
          tag=$(git tag -l 'firmware-v[0-9]*' --sort=-v:refname | grep -E '^firmware-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$tag" ]; then
            tag=firmware-v0.0.0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag"

      - uses: dart-lang/setup-dart@v1
      - name: Verify version increase
        working-directory: app/version_check
        run: |
          dart pub get
          dart run bin/version_check.dart -p "${{ steps.tag-version.outputs.tag }}" -n "${{ steps.firmware-version.outputs.version }}"
