targets:
  $default:
    builders:
      drift_dev:
        # disable drift's default builder, we're using the modular setup instead.
        # https://drift.simonbinder.eu/generation_options/modular/
        enabled: false

      drift_dev:analyzer:
        enabled: true
    
      drift_dev:modular:
        enabled: true
        # Required for dart run drift_dev make-migrations
        options:
          databases: 
              app_database: lib/models/database/app_database.dart
        