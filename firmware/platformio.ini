; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
	-DDEBUG_MODE=true
	-DUSE_INSECURE_HTTP=false
	-DMODBUS_DEBUG=true
lib_deps =
	h2zero/NimBLE-Arduino
	bblanchon/ArduinoJson

; Bench testing without an inverter: bypasses Modbus UART and returns
; example register data. Mock serial number is MOCKINV001 — use that
; when provisioning so the boot SN check passes.
; USE_INSECURE_HTTP skips TLS (plain WiFiClient) for local HTTP Supabase.
; MODBUS_DEBUG=1 full-range FC04 dump into snapshot metadata (set 0 for production).
[env:esp32dev-mock]
extends = env:esp32dev
build_flags =
	-DDEBUG_MODE=true
	-DUSE_INSECURE_HTTP=true
	-DMOCK_INVERTER=true
	-DMODBUS_DEBUG=false
